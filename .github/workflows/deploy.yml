name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-microservice:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo journalctl --vacuum-time=1d || true
            sudo rm -rf /tmp/* /var/tmp/* || true
            sudo apt-get clean || true
            sudo docker stop cloud-app || true
            sudo docker rm cloud-app || true
            sudo docker system prune -af --volumes || true
            sudo systemctl restart containerd || true
            sudo systemctl restart docker || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloud-microservice:latest
            sudo docker run -d --name cloud-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/cloud-microservice:latest
